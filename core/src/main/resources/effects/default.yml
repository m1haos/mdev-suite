# Effects shared by every M/Dev Studio plugin.
#
# Each effect is a list of elements that play together. Plugins refer to effects by name,
# so changing one here changes it everywhere it is used. You can add your own files to this
# folder; every .yml in it is loaded.
#
#   Preview:          /mdevcore effect <name>
#   After editing:    /mdevcore reload
#
# Element types and their own fields:
#   burst      one point (use count and spread for a cloud)
#   ring       radius, points, rotate (degrees per tick)
#   sphere     radius, points, grow (true = inflates over the duration)
#   helix      radius, height, turns, strands, points
#   shockwave  start-radius, radius, points
#   column     height, points, rise (share of the duration spent rising, 0.01 to 1)
#   fall       height, drift, angle, trail {particle fields + length}
#   sound      sound, volume, pitch
#   firework   shape (ball, ball_large, star, burst, creeper), colors, fade, flicker, trail
#   lightning  a flash and thunder, harmless
#
# Timing fields, for every element (ticks, 20 per second, or "2s"):
#   delay      wait before the element starts
#   duration   how long it plays
#   interval   draw every N ticks
#   y          height above the effect origin
#
# Particle fields, for shapes:
#   particle   any vanilla particle: flame, end_rod, dust, soul, cherry_leaves, ...
#   count, spread, speed
#   force      true = visible from far away (beams, sky effects)
#   color, to-color, size    for dust and dust_color_transition
#   block      for block, falling_dust, dust_pillar
#   item       for item


# ---------- Events ----------

event-announce:
  - {type: column, particle: end_rod, height: 30, points: 40, duration: 3s, interval: 4, rise: 0.4, force: true}
  - {type: ring, particle: dust, color: "#7FB3FF", size: 1.5, radius: 3, points: 40, rotate: 6, duration: 3s, interval: 2, y: 0.2}
  - {type: sound, sound: block.beacon.activate, volume: 2}

# Replayed over a running event by Eventide's "marker" stage, so the spot can be found from afar.
event-marker:
  - {type: column, particle: end_rod, height: 40, points: 30, duration: 20, interval: 4, rise: 0.5, force: true}
  - {type: ring, particle: dust, color: "#7FB3FF", size: 1.5, radius: 2.5, points: 24, rotate: 6, duration: 20, interval: 4, y: 0.2}

meteor-strike:
  - type: fall
    particle: flame
    count: 8
    spread: 0.3
    speed: 0.02
    force: true
    duration: 40
    height: 45
    drift: 18
    trail: {particle: large_smoke, count: 3, spread: 0.25, force: true, length: 8}
  - {type: fall, particle: lava, count: 2, spread: 0.4, force: true, duration: 40, height: 45, drift: 18}
  - {type: sound, sound: entity.blaze.shoot, volume: 3, pitch: 0.5}
  - {type: lightning, delay: 40}
  - {type: burst, particle: explosion_emitter, delay: 40}
  - {type: sound, sound: entity.generic.explode, volume: 6, pitch: 0.7, delay: 40}
  - {type: sphere, particle: flame, radius: 2.5, points: 50, grow: true, delay: 40, duration: 8}
  - {type: shockwave, particle: dust, color: "#FF8A3D", size: 2, radius: 7, delay: 40, duration: 12}
  - {type: shockwave, particle: cloud, speed: 0.02, radius: 9, points: 60, delay: 42, duration: 15}

event-victory:
  - {type: firework, shape: star, colors: ["#FFD166", "#FF8A3D"], fade: ["#FFFFFF"], trail: true, y: 3}
  - {type: firework, shape: ball_large, colors: ["#7FB3FF", "#B084F5"], flicker: true, y: 5, delay: 10}
  - {type: firework, shape: burst, colors: ["#8BD17C"], y: 4, delay: 20}
  - {type: sound, sound: ui.toast.challenge_complete, volume: 1.5}


# ---------- Caches: idle glow while waiting, and opening ----------
# Idle effects replay every few seconds, so players can spot caches from a distance.

cache-idle-common:
  - {type: ring, particle: dust, color: "#C8C8C8", size: 1, radius: 0.7, points: 12, rotate: 10, duration: 2s, interval: 5, y: 1.2}

cache-idle-rare:
  - {type: ring, particle: dust, color: "#5DADE2", size: 1.2, radius: 0.8, points: 16, rotate: 12, duration: 2s, interval: 4, y: 1.2}
  - {type: burst, particle: glow, count: 2, spread: 0.3, duration: 2s, interval: 10, y: 1}

cache-idle-epic:
  - {type: column, particle: dust_color_transition, color: "#B084F5", to-color: "#FFFFFF", size: 1.5, height: 25, points: 30, rise: 0.2, duration: 2s, interval: 5, force: true}
  - {type: helix, particle: witch, radius: 0.9, height: 2, turns: 2, strands: 2, points: 30, duration: 2s}

cache-open-common:
  - {type: burst, particle: crit, count: 20, spread: 0.4, speed: 0.2, y: 0.5}
  - {type: sound, sound: entity.item.pickup, pitch: 0.8}

cache-open-rare:
  - {type: burst, particle: glow, count: 25, spread: 0.5, speed: 0.1, y: 0.5}
  - {type: shockwave, particle: dust, color: "#5DADE2", size: 1.3, radius: 2.5, duration: 8}
  - {type: sound, sound: block.amethyst_block.chime, volume: 1.5, pitch: 1.2}

cache-open-epic:
  - {type: burst, particle: totem_of_undying, count: 60, spread: 0.4, speed: 0.5, y: 0.8}
  - {type: helix, particle: dust_color_transition, color: "#B084F5", to-color: "#FFD166", size: 1.3, radius: 1.2, height: 4, turns: 3, strands: 3, points: 60, duration: 20}
  - {type: shockwave, particle: end_rod, radius: 4, points: 40, duration: 12}
  - {type: sound, sound: ui.toast.challenge_complete, volume: 1.2}
  - {type: sound, sound: block.end_portal_frame.fill, pitch: 0.7}


# ---------- Guards and keys ----------

guard-spawn:
  - {type: column, particle: large_smoke, height: 2.5, points: 10, duration: 6, interval: 2}
  - {type: burst, particle: soul, count: 12, spread: 0.4, speed: 0.02, y: 1}
  - {type: sound, sound: entity.evoker.prepare_summon, volume: 0.8, pitch: 1.4}

guard-death:
  - {type: helix, particle: soul_fire_flame, radius: 0.6, height: 2.5, turns: 2, strands: 2, points: 24, duration: 12}
  - {type: sound, sound: particle.soul_escape, volume: 1.5}

key-drop:
  - {type: burst, particle: electric_spark, count: 15, spread: 0.3, speed: 0.1, y: 0.4}
  - {type: sound, sound: block.note_block.chime, pitch: 1.6}


# ---------- General purpose, for your own scenarios ----------

portal-open:
  - {type: ring, particle: reverse_portal, radius: 1.5, points: 30, rotate: 15, duration: 3s, interval: 2, y: 1}
  - {type: ring, particle: portal, radius: 1.8, points: 30, rotate: -12, duration: 3s, interval: 2, y: 1.6}
  - {type: helix, particle: dust, color: "#B084F5", size: 1.2, radius: 1.2, height: 3, turns: 3, strands: 2, points: 50, duration: 3s}
  - {type: sound, sound: block.portal.trigger, volume: 0.8}

frost-nova:
  - {type: sphere, particle: snowflake, radius: 2, points: 60, grow: true, duration: 8}
  - {type: shockwave, particle: snowflake, radius: 8, points: 60, duration: 14}
  - {type: shockwave, particle: dust, color: "#BDE6FF", size: 1.5, radius: 6, duration: 12, delay: 2}
  - {type: sound, sound: block.glass.break, volume: 1.5, pitch: 0.6}

sakura-bloom:
  - {type: burst, particle: cherry_leaves, count: 40, spread: 1.5, y: 2}
  - {type: helix, particle: cherry_leaves, radius: 1.5, height: 3, turns: 2, strands: 3, points: 45, duration: 30}
  - {type: sound, sound: block.cherry_leaves.place, volume: 1.2, pitch: 0.8}

infernal-pillar:
  - {type: helix, particle: flame, radius: 1, height: 5, turns: 3, strands: 2, points: 60, duration: 25}
  - {type: column, particle: lava, height: 5, points: 12, duration: 25, interval: 5}
  - {type: sound, sound: item.firecharge.use, volume: 1.5, pitch: 0.6}

holy-light:
  - {type: column, particle: end_rod, height: 20, points: 40, duration: 2s, interval: 3, rise: 0.3, force: true}
  - {type: sphere, particle: glow, radius: 1.5, points: 40, duration: 2s, interval: 10, y: 1}
  - {type: sound, sound: block.beacon.power_select, volume: 1.5, pitch: 1.2}


# ---------- Airdrop, zone and siege ----------

airdrop-trail:
  - {type: burst, particle: campfire_cosy_smoke, count: 2, spread: 0.2, speed: 0.01, force: true}
  - {type: burst, particle: firework, count: 3, spread: 0.3, speed: 0.02, force: true}

airdrop-land:
  - {type: burst, particle: explosion}
  - {type: shockwave, particle: cloud, speed: 0.02, radius: 5, points: 40, duration: 10}
  - {type: column, particle: dust, color: "#5DADE2", size: 2, height: 40, points: 40, rise: 0.3, duration: 3s, interval: 5, force: true}
  - {type: sound, sound: block.anvil.land, volume: 2, pitch: 0.6}

airdrop-open:
  - {type: firework, shape: ball_large, colors: ["#5DADE2", "#FFFFFF"], y: 3}
  - {type: burst, particle: glow, count: 40, spread: 0.6, speed: 0.2, y: 0.8}
  - {type: sound, sound: block.barrel.open, pitch: 0.7}
  - {type: sound, sound: ui.toast.challenge_complete}

# Plays with the zone radius as scale, so radius 1 here is the edge of any zone.
zone-border:
  - {type: ring, particle: dust, color: "#B084F5", size: 1.5, radius: 1, points: 20, y: 0.2}
  - {type: ring, particle: dust, color: "#B084F5", size: 1, radius: 1, points: 12, y: 1.4}

wave-start:
  - {type: shockwave, particle: dust, color: "#FF6B6B", size: 2, radius: 10, duration: 15}
  - {type: burst, particle: angry_villager, count: 6, spread: 1, y: 1.5}
  - {type: sound, sound: event.raid.horn, volume: 4}

boss-spawn:
  - {type: lightning}
  - {type: helix, particle: soul_fire_flame, radius: 1.5, height: 4, turns: 3, strands: 3, points: 60, duration: 30}
  - {type: sphere, particle: large_smoke, radius: 3, points: 60, grow: true, duration: 10}
  - {type: sound, sound: entity.wither.spawn, volume: 1.5, pitch: 1.2}

boss-phase:
  - {type: shockwave, particle: soul_fire_flame, radius: 6, points: 50, duration: 12}
  - {type: burst, particle: explosion, y: 1}
  - {type: sound, sound: entity.ravager.roar, volume: 2}

boss-death:
  - {type: column, particle: soul, height: 15, points: 40, rise: 0.5, duration: 2s, interval: 2, force: true}
  - {type: firework, shape: burst, colors: ["#FF6B6B", "#FFD166"], y: 3}
  - {type: sound, sound: entity.wither.death, pitch: 1.3}

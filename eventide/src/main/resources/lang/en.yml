  finished-plain: "<prefix><event> <gray>is over. Thanks to everyone who took part."
  top-line: "<gray>  <white><place>.</white> <player> <dark_gray>—</dark_gray> <accent><points></accent> pts"
  stopped: "<prefix><event> <gray>was stopped. No rewards this time."

container:
  need-key: "<prefix><warning>This cache opens with a key:</warning> <tier><warning>."
